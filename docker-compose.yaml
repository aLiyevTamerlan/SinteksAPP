services:
  postgres:
    image: postgres:latest
    container_name: sinteks_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sinteks_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data_v2:/var/lib/postgresql  # Changed from /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_v2:
    driver: local